<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

<body>
    <div class="w-full my-6 bg-white flex items-center justify-center min-h-full p-2">
        <div class="container max-w-6xl">
            <div class="bg-white rounded-xl overflow-hidden">
                <!-- Table Header -->
                <div class="p-6 border-b border-gray-200">
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">Product Management</h2>
                            <p class="text-gray-500 mt-1">Manage your products and inventory from this
                                dashboard.
                            </p>
                        </div>
                        <div class="mt-4 md:mt-0">
                            <button
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition duration-150 ease-in-out"
                                type="button" data-modal-target="authentication-modal"
                                data-modal-toggle="authentication-modal">
                                New Product
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Product Name
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Image
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Price
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Created Date
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody id="productTable" class="bg-white divide-y divide-gray-200">
                            <!-- Product rows will be inserted here by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Modal -->
                <div id="authentication-modal" tabindex="-1" aria-hidden="true"
                    class="hidden fixed inset-0 z-50 flex items-center justify-center">
                    <div class="relative  w-full max-w-lg p-1 bg-white rounded-lg shadow dark:bg-gray-700">
                        <!-- Header: Title + Close button -->
                        <div class="flex justify-between items-center p-4 border-b rounded-t dark:border-gray-600">
                            <h3 class="text-xl font-medium text-gray-900 dark:text-white">
                                Make a New Product
                            </h3>
                            <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 
                                        rounded-lg text-sm p-1.5 ml-auto inline-flex items-center 
                                        dark:hover:bg-gray-800 dark:hover:text-white"
                                data-modal-hide="authentication-modal">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 
                                                111.414 1.414L11.414 10l4.293 4.293a1 1 0 
                                                01-1.414 1.414L10 11.414l-4.293 
                                                4.293a1 1 0 01-1.414-1.414L8.586 
                                                10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                </svg>
                            </button>
                        </div>

                        <!-- Modal Body -->
                        <form id="createProductForm" class="space-y-6 px-6 pb-6 pt-4">
                            <!-- Product Name -->
                            <div>
                                <label for="productName"
                                    class="text-sm font-medium text-gray-900 block mb-2 dark:text-gray-300">
                                    Product Name
                                </label>
                                <input type="text" id="productName" name="productName" required
                                    placeholder="Enter a product name" class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg 
                                            focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 
                                            dark:bg-gray-600 dark:border-gray-500 dark:text-white">
                            </div>
                            <!-- Product Price -->
                            <div>
                                <label for="price"
                                    class="text-sm font-medium text-gray-900 block mb-2 dark:text-gray-300">
                                    Price
                                </label>
                                <input type="number" id="productPrice" name="productPrice" required
                                    placeholder="Enter a price" class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg 
                                            focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 
                                            dark:bg-gray-600 dark:border-gray-500 dark:text-white">
                            </div>
                            <!-- Image -->
                            <div>
                                <label for="imageFile"
                                    class="text-sm font-medium text-gray-900 block mb-2 dark:text-gray-300">
                                    Upload Image
                                </label>
                                <input type="file" id="productImage" name="productImage" accept="image/*" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg 
                                            cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none 
                                            dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400">
                            </div>
                            <!-- Submit -->
                            <button type="submit" class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 
                                        focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center 
                                        dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                                Create
                            </button>
                        </form>
                    </div>
                </div>
            </div>
